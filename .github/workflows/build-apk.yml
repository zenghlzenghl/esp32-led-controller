name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install required SDK components
        run: |
          echo "=== Installing required Android SDK components ==="
          
          # Set up environment
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Accept all licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install required components (platform, build-tools)
          echo "Installing Android SDK platform 34..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || true
          
          echo "Installing build-tools 34.0.0..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
          
          echo "=== SDK Setup Complete ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | head -20

      - name: Check repository structure
        run: |
          echo "=== Repository Structure Check ==="
          pwd
          ls -la
          echo ""
          echo "Key files:"
          for f in build.gradle settings.gradle gradlew app/build.gradle; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ $f MISSING"; fi
          done

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          echo "=== Starting Gradle Build ==="
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/tools:$ANDROID_HOME/cmdline-tools/latest/bin
          
          echo "Gradle version:"
          ./gradlew --version
          
          echo ""
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          
          BUILD_RESULT=${PIPESTATUS[0]}
          echo ""
          echo "=== Build Exit Code: $BUILD_RESULT ==="
          exit $BUILD_RESULT

      - name: Show build results
        if: always()
        run: |
          echo "=== Build Results ==="
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "✅ APK files found:"
            ls -lah app/build/outputs/apk/debug/
          else
            echo "❌ No APK in debug directory"
          fi
          
          echo ""
          echo "All APK files in project:"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
        if: always()
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-LED-Controller-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
        continue-on-error: true
