name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Android command line tools
        run: |
          echo "=== Downloading Android SDK Command-line Tools ==="
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "✅ Android SDK Command-line Tools downloaded"

      - name: Setup Android SDK environment
        run: |
          echo "=== Setting up Android SDK ==="
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Accept all licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install required components
          echo "Installing platform android-34..."
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          
          echo "Installing build-tools 34.0.0..."
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          
          echo "Installing platform-tools..."
          sdkmanager "platform-tools" > /dev/null 2>&1 || true
          
          # Save paths for next steps
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          echo "✅ Android SDK setup complete"
          sdkmanager --list_installed | head -10

      - name: Setup Gradle Wrapper with correct version
        run: |
          echo "=== Setting up Gradle Wrapper ==="
          
          # Read required Gradle version from properties file
          GRADLE_VERSION=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\).*/\1/')
          echo "Required Gradle version: ${GRADLE_VERSION:-8.2}"
          
          # Check if we have a valid gradle-wrapper.jar
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            JAR_SIZE=$(stat -c%s "gradle/wrapper/gradle-wrapper.jar")
            if [ "$JAR_SIZE" -gt 50000 ]; then
              echo "✅ Valid gradle-wrapper.jar found (${JAR_SIZE} bytes)"
            else
              echo "⚠️ gradle-wrapper.jar too small (${JAR_SIZE} bytes), regenerating..."
              rm -f gradle/wrapper/gradle-wrapper.jar
            fi
          fi
          
          # If no valid jar, download correct Gradle version and generate wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading Gradle ${GRADLE_VERSION:-8.2} to generate wrapper..."
            
            # Download the specific Gradle version we need (NOT using system gradle!)
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION:-8.2}-bin.zip" -o /tmp/gradle-${GRADLE_VERSION:-8.2}.zip
            
            if [ -f "/tmp/gradle-${GRADLE_VERSION:-8.2}.zip" ] && [ -s "/tmp/gradle-${GRADLE_VERSION:-8.2}.zip" ]; then
              echo "Extracting Gradle ${GRADLE_VERSION:-8.2}..."
              rm -rf /tmp/gradle_dist
              mkdir -p /tmp/gradle_dist
              unzip -q -o /tmp/gradle-${GRADLE_VERSION:-8.2}.zip -d /tmp/gradle_dist
              
              echo "Generating wrapper with Gradle ${GRADLE_VERSION:-8.2}..."
              /tmp/gradle_dist/gradle-${GRADLE_VERSION:-8.2}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION:-8.2}
              
              echo "✅ Wrapper generated successfully"
            else
              echo "❌ Failed to download Gradle ${GRADLE_VERSION:-8.2}"
              exit 1
            fi
          fi
          
          # Final verification
          echo ""
          echo "=== Verification ==="
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ gradle-wrapper.jar ready:"
            ls -lh gradle/wrapper/gradle-wrapper.jar
            file gradle/wrapper/gradle-wrapper.jar
            echo "JAR size: $(stat -c%s gradle/wrapper/gradle-wrapper.jar) bytes"
            
            # Show wrapper properties
            echo ""
            echo "Gradle wrapper configuration:"
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "❌ Failed to setup gradle-wrapper.jar!"
            ls -la gradle/wrapper/
            exit 1
          fi

      - name: Make gradlew executable and fix line endings
        run: |
          echo "=== Fixing line endings for gradlew ==="
          # Convert Windows line endings (CRLF) to Unix (LF)
          sed -i 's/\r$//' gradlew
          # Make executable
          chmod +x ./gradlew
          # Verify
          file gradlew
          head -1 gradlew | cat -A

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          echo "=== Building APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "Build exit code: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Check for APK
        if: always()
        run: |
          echo "=== Checking Build Output ==="
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "✅ SUCCESS! APK files:"
            ls -lah app/build/outputs/apk/debug/
          else
            echo "❌ No debug APK found"
            echo ""
            echo "Looking for any APK files..."
            find . -name "*.apk" 2>/dev/null || echo "No APKs found"
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
        if: always()
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-LED-Controller
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
        continue-on-error: true
